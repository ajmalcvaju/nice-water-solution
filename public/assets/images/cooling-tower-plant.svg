<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="skyDay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="towerMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="greenPipe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="concreteWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Clear Sky -->
  <rect x="0" y="0" width="900" height="260" fill="url(#skyDay)" />

  <!-- Industrial Modular Cooling Towers (Towers 1, 2, 3) -->
  <!-- Tower 1 -->
  <g transform="translate(100, 40)">
    <rect x="0" y="0" width="220" height="220" fill="url(#towerMetal)" stroke="#475569" stroke-width="2" />
    <!-- Louver mesh -->
    <rect x="20" y="40" width="180" height="150" fill="#1e293b" />
    <!-- X-cross braces -->
    <line x1="20" y1="40" x2="200" y2="190" stroke="#94a3b8" stroke-width="4" />
    <line x1="200" y1="40" x2="20" y2="190" stroke="#94a3b8" stroke-width="4" />
    <circle cx="110" cy="115" r="16" fill="#cbd5e1" />
    <!-- Fan Cowl on Top -->
    <ellipse cx="110" cy="0" rx="40" ry="12" fill="#64748b" />
  </g>

  <!-- Tower 2 -->
  <g transform="translate(360, 40)">
    <rect x="0" y="0" width="220" height="220" fill="url(#towerMetal)" stroke="#475569" stroke-width="2" />
    <rect x="20" y="40" width="180" height="150" fill="#1e293b" />
    <line x1="20" y1="40" x2="200" y2="190" stroke="#94a3b8" stroke-width="4" />
    <line x1="200" y1="40" x2="20" y2="190" stroke="#94a3b8" stroke-width="4" />
    <circle cx="110" cy="115" r="16" fill="#cbd5e1" />
    <ellipse cx="110" cy="0" rx="40" ry="12" fill="#64748b" />
  </g>

  <!-- Tower 3 -->
  <g transform="translate(620, 40)">
    <rect x="0" y="0" width="220" height="220" fill="url(#towerMetal)" stroke="#475569" stroke-width="2" />
    <rect x="20" y="40" width="180" height="150" fill="#1e293b" />
    <line x1="20" y1="40" x2="200" y2="190" stroke="#94a3b8" stroke-width="4" />
    <line x1="200" y1="40" x2="20" y2="190" stroke="#94a3b8" stroke-width="4" />
    <circle cx="110" cy="115" r="16" fill="#cbd5e1" />
    <ellipse cx="110" cy="0" rx="40" ry="12" fill="#64748b" />
  </g>

  <!-- Concrete Base & Retaining Wall -->
  <rect x="0" y="260" width="900" height="240" fill="url(#concreteWall)" />

  <!-- Prominent Industrial Water Treatment Green Distribution Pipes -->
  <!-- Main Horizontal Header Pipe -->
  <rect x="0" y="380" width="900" height="42" rx="6" fill="url(#greenPipe)" stroke="#065f46" stroke-width="2" />
  <!-- Flange Connections -->
  <rect x="180" y="374" width="20" height="54" rx="4" fill="#047857" stroke="#ffffff" stroke-width="1.5" />
  <rect x="420" y="374" width="20" height="54" rx="4" fill="#047857" stroke="#ffffff" stroke-width="1.5" />
  <rect x="680" y="374" width="20" height="54" rx="4" fill="#047857" stroke="#ffffff" stroke-width="1.5" />

  <!-- Vertical Feeder Risers -->
  <!-- Riser 1 -->
  <path d="M190,380 L190,290 L270,290 L270,240" fill="none" stroke="url(#greenPipe)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Riser 2 -->
  <path d="M430,380 L430,290 L510,290 L510,240" fill="none" stroke="url(#greenPipe)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Riser 3 -->
  <path d="M690,380 L690,290 L770,290 L770,240" fill="none" stroke="url(#greenPipe)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Heavy Duty Isolation Wheel Valves -->
  <circle cx="190" cy="330" r="14" fill="#1e293b" stroke="#ffffff" stroke-width="2" />
  <circle cx="430" cy="330" r="14" fill="#1e293b" stroke="#ffffff" stroke-width="2" />
  <circle cx="690" cy="330" r="14" fill="#1e293b" stroke="#ffffff" stroke-width="2" />
</svg>
