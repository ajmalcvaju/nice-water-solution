<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 380" width="260" height="380">
  <defs>
    <linearGradient id="ssBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#f1f5f9" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="chromeTap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="coolerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Stainless Steel Main Cabinet Body -->
  <rect x="40" y="30" width="180" height="300" rx="8" fill="url(#ssBody)" filter="url(#coolerShadow)" stroke="#cbd5e1" stroke-width="2" />

  <!-- Top Nice Water Solutions Branding Emblem -->
  <rect x="85" y="45" width="90" height="22" rx="4" fill="#0056b3" />
  <text x="130" y="60" font-family="'Outfit', sans-serif" font-size="10" font-weight="900" fill="#f59e0b" text-anchor="middle">NICE COOL</text>

  <!-- 3 Dispensing Chrome Taps (Cold, Normal, Hot) -->
  <g transform="translate(65, 120)">
    <g transform="translate(0, 0)">
      <circle cx="15" cy="0" r="7" fill="url(#chromeTap)" stroke="#475569" stroke-width="1.5" />
      <path d="M15,7 L15,22 L10,25" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="15" cy="-2" r="3" fill="#00a8e8" />
    </g>
    <g transform="translate(50, 0)">
      <circle cx="15" cy="0" r="7" fill="url(#chromeTap)" stroke="#475569" stroke-width="1.5" />
      <path d="M15,7 L15,22 L10,25" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="15" cy="-2" r="#10b981" />
    </g>
    <g transform="translate(100, 0)">
      <circle cx="15" cy="0" r="7" fill="url(#chromeTap)" stroke="#475569" stroke-width="1.5" />
      <path d="M15,7 L15,22 L10,25" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="15" cy="-2" r="#ef4444" />
    </g>
  </g>

  <!-- SS Drip Tray Basin -->
  <rect x="36" y="165" width="188" height="24" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" />
  <line x1="45" y1="172" x2="215" y2="172" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Lower Ventilation Louvers -->
  <g transform="translate(60, 215)">
    <g>
      <rect x="0" y="0" width="60" height="5" rx="2" fill="#334155" />
      <rect x="0" y="10" width="60" height="5" rx="2" fill="#334155" />
      <rect x="0" y="20" width="60" height="5" rx="2" fill="#334155" />
      <rect x="0" y="30" width="60" height="5" rx="2" fill="#334155" />
      <rect x="0" y="40" width="60" height="5" rx="2" fill="#334155" />
      <rect x="0" y="50" width="60" height="5" rx="2" fill="#334155" />
      <rect x="0" y="60" width="60" height="5" rx="2" fill="#334155" />
      <rect x="0" y="70" width="60" height="5" rx="2" fill="#334155" />
    </g>
    <g transform="translate(80, 0)">
      <rect x="0" y="0" width="60" height="5" rx="2" fill="#334155" />
      <rect x="0" y="10" width="60" height="5" rx="2" fill="#334155" />
      <rect x="0" y="20" width="60" height="5" rx="2" fill="#334155" />
      <rect x="0" y="30" width="60" height="5" rx="2" fill="#334155" />
      <rect x="0" y="40" width="60" height="5" rx="2" fill="#334155" />
      <rect x="0" y="50" width="60" height="5" rx="2" fill="#334155" />
      <rect x="0" y="60" width="60" height="5" rx="2" fill="#334155" />
      <rect x="0" y="70" width="60" height="5" rx="2" fill="#334155" />
    </g>
  </g>

  <!-- Base Feet -->
  <rect x="52" y="330" width="20" height="24" rx="3" fill="#0f172a" />
  <rect x="188" y="330" width="20" height="24" rx="3" fill="#0f172a" />
</svg>
