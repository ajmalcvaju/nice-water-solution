<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 380" width="340" height="380">
  <defs>
    <linearGradient id="ssGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="pumpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#003d7a" />
    </linearGradient>
    <filter id="skidShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- SS Framework / Skid Structure -->
  <g stroke="url(#ssGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="35" y="40" width="270" height="300" rx="6" />
    <line x1="35" y1="160" x2="305" y2="160" stroke-width="6" />
    <line x1="170" y1="40" x2="170" y2="340" stroke-width="6" />
  </g>

  <!-- Pre-treatment Vessel Cylinders -->
  <rect x="220" y="70" width="65" height="250" rx="14" fill="#0056b3" />
  <rect x="235" y="60" width="35" height="15" fill="#334155" rx="3" />

  <!-- Horizontal RO Membrane Pressure Vessels -->
  <rect x="55" y="190" width="22" height="140" rx="10" fill="url(#ssGrad)" stroke="#64748b" stroke-width="1.5" />
  <rect x="90" y="190" width="22" height="140" rx="10" fill="url(#ssGrad)" stroke="#64748b" stroke-width="1.5" />

  <!-- High Pressure Vertical Multistage Pump -->
  <g transform="translate(130, 180)">
    <rect x="5" y="0" width="30" height="35" rx="4" fill="url(#pumpGrad)" />
    <line x1="8" y1="10" x2="32" y2="10" stroke="#047857" stroke-width="2" />
    <line x1="8" y1="18" x2="32" y2="18" stroke="#047857" stroke-width="2" />
    <line x1="8" y1="26" x2="32" y2="26" stroke="#047857" stroke-width="2" />
    <rect x="10" y="35" width="20" height="15" fill="#1e293b" />
    <rect x="8" y="50" width="24" height="90" rx="2" fill="url(#ssGrad)" stroke="#64748b" stroke-width="1" />
    <rect x="2" y="140" width="36" height="14" rx="3" fill="#1e293b" />
  </g>

  <!-- Smart Electrical Control Panel on Top Left -->
  <g transform="translate(45, 50)" filter="url(#skidShadow)">
    <rect x="0" y="0" width="115" height="95" rx="6" fill="url(#panelGrad)" stroke="#93c5fd" stroke-width="1.5" />
    
    <!-- Flow Meters -->
    <rect x="12" y="18" width="14" height="42" rx="3" fill="#ffffff" opacity="0.9" />
    <line x1="19" y1="20" x2="19" y2="58" stroke="#0066cc" stroke-width="1" />
    <circle cx="19" cy="38" r="3" fill="#ef4444" />
    
    <rect x="34" y="18" width="14" height="42" rx="3" fill="#ffffff" opacity="0.9" />
    <line x1="41" y1="20" x2="41" y2="58" stroke="#0066cc" stroke-width="1" />
    <circle cx="41" cy="45" r="3" fill="#00e5ff" />

    <!-- Pressure Gauges -->
    <circle cx="70" cy="30" r="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="95" cy="30" r="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <line x1="70" y1="30" x2="76" y2="24" stroke="#ef4444" stroke-width="1.5" />
    <line x1="95" y1="30" x2="99" y2="22" stroke="#ef4444" stroke-width="1.5" />

    <!-- Digital Micro-Controller -->
    <rect x="10" y="68" width="95" height="18" rx="3" fill="#0f172a" />
    <text x="57" y="80" font-family="'Outfit', monospace" font-size="7.5" font-weight="800" fill="#f59e0b" text-anchor="middle">NICE AUTO-RO PLANT</text>
  </g>

  <!-- Piping -->
  <path d="M125,230 L125,210 L150,210 L150,230" fill="none" stroke="#64748b" stroke-width="4" />
  <path d="M170,300 L220,300" fill="none" stroke="#64748b" stroke-width="4" />
</svg>
